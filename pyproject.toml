[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic"
version = "1.0.0"
description = "Spatio-temporal traffic speed forecasting on METR-LA"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.6", "statsmodels>=0.14",
    "h5py>=3.10", "torch>=2.2", "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbformat", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
